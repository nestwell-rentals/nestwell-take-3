# Local PostgreSQL and S3-compatible storage for development and the Playwright e2e suite.
# The app itself runs with `pnpm dev` on your machine (or on Railway in production).
#
# `docker compose up -d postgres` is all you need for development. Add `minio minio-init`
# to store uploads in a local bucket, the way a Railway deploy stores them in a Railway Bucket.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-payload}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-payload}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Stands in for a Railway Bucket. Like Railway's, the bucket is private: files are served
  # through Payload, never directly from the bucket.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data
    ports:
      - '${MINIO_PORT:-9000}:9000'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-payload}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-payload-secret}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs http://localhost:9000/minio/health/live || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot job that creates the bucket. Payload's S3 adapter does not create buckets.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${MINIO_BUCKET}
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-payload}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-payload-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-payload}

volumes:
  postgres_data:
  minio_data:
